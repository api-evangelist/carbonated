name: Carbonated
description: >-
  Carbonated Inc. is a mobile game developer founded in 2015 by industry
  veterans from Zynga, Electronic Arts, and Blizzard. The studio builds hardcore
  PvEvP (player-versus-environment-versus-player) games for phones and uses AI to
  help drive moment-to-moment gameplay. Its debut title is Mad World, currently in
  early-access sign-up. Carbonated also operates Carbyne, a proprietary live-ops
  platform that lets the team instantly modify almost every part of the game
  experience through a comprehensive set of web tools, built to support multiple
  games. Carbonated is a portfolio company of Andreessen Horowitz (a16z). As of
  this profile Carbonated publishes no public developer API, documentation, or
  developer portal; this record captures the company identity for the API
  Evangelist network.
